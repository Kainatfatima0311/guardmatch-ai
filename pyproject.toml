[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardmatch"
version = "0.1.0"
description = "Resume screening and guard job matching — ranks security guard applicants against job requirements with explanations and fairness auditing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kainat Fatima" }]
keywords = ["ranking", "learning-to-rank", "fairness", "explainability", "hiring"]

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # NLP
    "spacy>=3.8",
    "rapidfuzz>=3.10",

    # Model
    "lightgbm>=4.5",
    "shap>=0.46",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",

    # Synthetic data
    "faker>=30.0",

    # Observability
    "structlog>=24.4",
    "prometheus-client>=0.21",

    # CLI
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
]

[project.scripts]
guardmatch = "guardmatch.cli:app"

[project.urls]
Repository = "https://github.com/Kainatfatima0311/guardmatch-ai"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print  -- see note below
    "RUF",  # ruff-specific
    "PTH",  # prefer pathlib
    "RET",  # return statement consistency
    "ARG",  # unused arguments
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI's Depends() in defaults is idiomatic
]

# T20 bans print() and pprint() across the source tree. This is not a style
# preference: the project brief requires real logging, and "print statements
# don't count". Banning print at lint time is what makes that requirement
# enforceable rather than aspirational.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]        # pytest fixtures legitimately appear unused
"src/guardmatch/cli.py" = ["T20"]  # CLI output to stdout is the point

[tool.ruff.lint.isort]
known-first-party = ["guardmatch"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/guardmatch"]
strict = true
warn_unreachable = true
warn_return_any = true
show_error_codes = true
pretty = true

# These libraries ship no type stubs. Rather than weakening `strict` globally,
# the gap is confined to exactly the imports that need it.
[[tool.mypy.overrides]]
module = ["lightgbm.*", "shap.*", "spacy.*", "sklearn.*", "faker.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--cov=guardmatch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    # Enforced rather than merely reported. A coverage number nobody acts on is
    # a statistic; a threshold that fails the build is a constraint. Set below
    # the current 95% so ordinary work is not blocked by a one-line dip, but
    # high enough that a whole untested module cannot land.
    "--cov-fail-under=85",
]
markers = [
    "gate: fairness or leakage gate — must fail the build when violated",
    "slow: excluded from the fast feedback loop",
]

[tool.coverage.run]
source = ["src/guardmatch"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
