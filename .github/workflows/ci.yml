name: CI

# Runs on every push and pull request. The gates below are the point of this
# workflow: a fairness regression or a protected-attribute leak has to fail a
# build, not wait to be noticed in review.
#
# The repository holds two runtimes. Python jobs set `working-directory: backend`
# through a job-level default rather than repeating `cd backend` in every step,
# which keeps the step bodies identical to the commands a contributor runs by
# hand. Note that `working-directory` does not apply to action inputs — an
# artifact `path` stays relative to the workspace root, which is why the coverage
# upload names `backend/coverage.xml` explicitly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

# A new push supersedes an in-flight run on the same ref. Nothing is learned from
# finishing a run against code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        # Includes the T20 rule, so a stray print() fails here. The brief
        # requires real logging; this is what makes that enforceable.
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm

      - name: Run test suite
        # Coverage threshold is enforced in pyproject.toml, so a drop fails here.
        run: pytest -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          # Action inputs ignore the job's working-directory default.
          path: backend/coverage.xml
          if-no-files-found: warn

  gates:
    name: Fairness and leakage gates
    runs-on: ubuntu-latest
    # Run separately as well as inside the full suite. The full run reports one
    # number; this job makes it unambiguous in the checks list whether the
    # fairness and leakage gates specifically passed, which is the question a
    # reviewer of a hiring system should be able to answer at a glance.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm

      - name: Gates
        run: pytest -m gate -v --no-cov

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # `npm ci` rather than `npm install`: it installs exactly the lockfile
        # and fails if the two have drifted, which is the same argument as
        # generating the dataset from a fixed seed.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        # Separate from the build. Next.js can emit a working bundle while types
        # are wrong, so the type check has to be its own gate to mean anything.
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: guardmatch-ai:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: guardmatch-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Verify the container serves a verified model
        # Building an image proves it compiles. Starting it and checking /ready
        # proves the artifacts inside it pass checksum verification, which is the
        # failure that would otherwise surface only on deploy.
        run: |
          docker run -d --name guardmatch-ci -p 8000:8000 guardmatch-ai:ci
          for attempt in $(seq 1 30); do
            if curl -fs http://localhost:8000/ready > /dev/null; then
              echo "ready after ${attempt}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:8000/health
          curl -fs http://localhost:8000/ready
          curl -fs http://localhost:8000/model-info

      - name: Confirm the API container runs as non-root
        run: |
          uid=$(docker exec guardmatch-ci id -u)
          echo "api container uid: $uid"
          test "$uid" != "0"

      - name: Verify the web container serves the workspace
        # Started against the running API so the proxy path is exercised, not
        # just the static bundle.
        run: |
          docker run -d --name guardmatch-web-ci --network host \
            -e BACKEND_URL=http://localhost:8000 guardmatch-web:ci
          for attempt in $(seq 1 30); do
            if curl -fs http://localhost:3000/ > /dev/null; then
              echo "web ready after ${attempt}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:3000/ > /dev/null
          curl -fs http://localhost:3000/api/ready

      - name: Confirm the web container runs as non-root
        run: |
          uid=$(docker exec guardmatch-web-ci id -u)
          echo "web container uid: $uid"
          test "$uid" != "0"

      - name: Container logs
        if: always()
        run: |
          docker logs guardmatch-ci || true
          docker logs guardmatch-web-ci || true

      - name: Clean up
        if: always()
        run: |
          docker rm -f guardmatch-ci || true
          docker rm -f guardmatch-web-ci || true
